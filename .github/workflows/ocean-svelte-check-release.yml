# Fork-only: publishes svelte-check platform packages as GitHub release assets
# until the fixes on this branch ship upstream (baseballyama/rsvelte#4767, #4768).
name: Ocean svelte-check release

on:
  push:
    tags: ['svelte-check-v*']

permissions:
  contents: write

jobs:
  build:
    name: Build svelte-check (${{ matrix.triple }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, triple: darwin-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, triple: darwin-x64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, triple: linux-x64-gnu }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu, triple: linux-arm64-gnu, apt: gcc-aarch64-linux-gnu, linker: aarch64-linux-gnu-gcc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout svelte submodule (shallow)
        run: git submodule update --init --checkout --depth 1 submodules/svelte

      - name: Install cross-compile linker
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Build svelte-check
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --profile dist -p rsvelte_check --bin svelte_check --target ${{ matrix.target }}

      - name: Stage package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#svelte-check-v}"
          pkg="apps/npm/svelte-check-${{ matrix.triple }}"
          mkdir -p "$GITHUB_WORKSPACE/stage"
          cp "target/${{ matrix.target }}/dist/svelte_check" "$pkg/svelte-check"
          chmod +x "$pkg/svelte-check"
          (cd "$pkg" && npm pkg set version="$VERSION" && npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/stage")

      - name: Check glibc floor
        if: startsWith(matrix.triple, 'linux-')
        run: scripts/release/check-glibc-floor.sh "target/${{ matrix.target }}/dist/svelte_check"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: svelte-check-${{ matrix.triple }}
          path: stage/*.tgz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: stage
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" stage/*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --title "svelte-check ${TAG#svelte-check-v}" \
            --notes "svelte-check platform packages built from $GITHUB_SHA: upstream main plus baseballyama/rsvelte#4767 (faster overlay) and #4768 (generic arrows in .tsx shadows). Temporary, until both ship upstream." \
            --prerelease
